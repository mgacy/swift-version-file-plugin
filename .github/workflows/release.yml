name: Release
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Type of release
        type: choice
        required: true
        options:
          - patch
          - minor
          - major

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Git checkout
        uses: actions/checkout@v7

      - name: Get latest release version
        id: get_current_version
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |
            const { data: { tag_name } } = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo
            })
            return tag_name

      - name: Bump version
        id: bump
        uses: mgacy/bump-version-action@v1
        with:
          release-type: ${{ inputs.release_type }}
          version: ${{ steps.get_current_version.outputs.result }}

      - name: Push tag
        uses: actions/github-script@v9
        with:
          script: |
            const version = '${{ steps.bump.outputs.version }}';
            const sha = context.sha;
            if (!/^\d+\.\d+\.\d+$/.test(version)) {
              core.setFailed(`Bump step returned unexpected version "${version}"`);
              return;
            }
            const tag = `refs/tags/${version}`;
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: tag,
                sha: sha
              });
              core.info(`Created tag ${tag} at ${sha}`);
            } catch (error) {
              if (error.status !== 422) {
                throw error;
              }
              core.warning(`Tag ${tag} already exists; verifying it points to ${sha}`);
              const { data: ref } = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${version}`
              });
              if (ref.object.sha !== sha) {
                core.setFailed(`Tag ${tag} exists but points to ${ref.object.sha}, not ${sha}`);
              }
            }

      - name: Create release
        uses: actions/github-script@v9
        with:
          script: |
            const version = '${{ steps.bump.outputs.version }}';
            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: version,
              generate_release_notes: true,
              draft: false,
              prerelease: false
            });
            core.info(`Created release ${release.html_url}`);
